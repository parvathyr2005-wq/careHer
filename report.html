<!DOCTYPE html>
<html>

<head>
    <title>Anonymous Report - careHer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">care<span>Her</span></div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="jobs.html">Jobs</a></li>
            <li><a href="report.html" class="active">Report</a></li>
        </ul>
    </header>

    <section class="profile-form">
        <h2>🚨 Anonymous Workplace Report</h2>
        <p style="margin-bottom:20px; color:#666;">
            Your identity will remain completely anonymous.
            We review all reports seriously to protect women.
        </p>

        <select id="reportType">
            <option value="">Select Issue Type</option>
            <option value="harassment">Harassment</option>
            <option value="discrimination">Discrimination</option>
            <option value="unsafe">Unsafe Workplace</option>
            <option value="salary">Salary Issues</option>
            <option value="other">Other</option>
        </select>

        <input type="text" id="companyName" placeholder="Company Name">

        <textarea id="reportDetails" rows="5" placeholder="Describe the issue in detail..."></textarea>

        <button class="btn-primary" onclick="submitReport()">
            Submit Anonymous Report
        </button>

        <p id="successMsg" style="margin-top:15px; color:green;"></p>
    </section>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc }
            from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        /* 🔥 Your Firebase Config */
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function submitReport() {

            const type = document.getElementById("reportType").value;
            const company = document.getElementById("companyName").value;
            const details = document.getElementById("reportDetails").value;

            if (type === "" || company === "" || details === "") {
                alert("Please fill all fields");
                return;
            }

            try {
                await addDoc(collection(db, "anonymousReports"), {
                    type: type,
                    company: company,
                    details: details,
                    timestamp: new Date()
                });

                document.getElementById("successMsg").innerText =
                    "Report submitted successfully. Thank you for helping protect women 💜";

                document.getElementById("reportType").value = "";
                document.getElementById("companyName").value = "";
                document.getElementById("reportDetails").value = "";

            } catch (error) {
                alert("Error submitting report");
            }
        }

        window.submitReport = submitReport;

    </script>

</body>

</html>
